name: Release

# Bouwt bij elke tag vX.Y.Z een zelfstandige FlexPoll voor Windows, Linux en
# macOS, hangt ze aan de GitHub-release en pusht een container-image naar GHCR.
#
#   git tag -a v1.1.0 -m "FlexPoll 1.1.0" && git push --follow-tags

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # download-artifact leest de artifacts via de API; zonder `actions: read`
  # faalt de private repo met "Artifact download failed after 5 retries".
  actions: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux vastgepind op 22.04 (glibc 2.35), niet `ubuntu-latest`: sinds
          # oktober 2026 schuift die naar Ubuntu 26 en dan eist de binary glibc
          # 2.4x — te nieuw voor Debian 12 en Raspberry Pi OS Bookworm (2.36).
          # Pin bewust: een diagnosetool moet op oude dozen draaien.
          - os: ubuntu-22.04
            label: linux-x64
            archive: tar.gz
          - os: ubuntu-22.04-arm
            label: linux-arm64
            archive: tar.gz
          - os: windows-latest
            label: windows-x64
            archive: zip
          # Zelfde app als één bestand. Aparte job: een onefile-build heeft een
          # ander spec-bestand en levert een bare .exe in plaats van een zip.
          - os: windows-latest
            label: windows-x64-onefile
            archive: exe
          - os: macos-15
            label: macos-arm64
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (PyInstaller, onedir)
        if: matrix.archive != 'exe'
        run: pyinstaller --noconfirm --clean flexpoll.spec

      - name: Build (PyInstaller, onefile)
        if: matrix.archive == 'exe'
        run: pyinstaller --noconfirm --clean flexpoll-onefile.spec

      - name: Versie uit de bundel controleren
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "exe" ]; then BIN="dist/flexpoll.exe"
          elif [ "${{ runner.os }}" = "Windows" ]; then BIN="dist/FlexPoll/flexpoll.exe"
          else BIN="dist/FlexPoll/flexpoll"; fi
          "$BIN" --version
          test "$("$BIN" --version)" = "FlexPoll $(cat VERSION)"

      - name: Inpakken (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd dist
          tar czf "FlexPoll-${GITHUB_REF_NAME}-${{ matrix.label }}.tar.gz" FlexPoll

      - name: Inpakken (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "FlexPoll-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" FlexPoll > /dev/null
          else
            zip -qr "FlexPoll-${GITHUB_REF_NAME}-${{ matrix.label }}.zip" FlexPoll
          fi

      - name: Hernoemen (onefile exe)
        if: matrix.archive == 'exe'
        shell: bash
        run: |
          mv dist/flexpoll.exe "dist/FlexPoll-${GITHUB_REF_NAME}-${{ matrix.label }}.exe"
          ls -lh dist/*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: flexpoll-${{ matrix.label }}
          path: |
            dist/FlexPoll-*.tar.gz
            dist/FlexPoll-*.zip
            dist/FlexPoll-*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    # Alleen bij een echte tag. Een handmatige workflow_dispatch bouwt en test
    # de artifacts, maar mag nooit een release met de branchnaam aanmaken.
    #
    # `always()` omdat macOS-runners soms geannuleerd worden (capaciteit). Zonder
    # dit blijft de hele release liggen terwijl Windows en Linux wél gebouwd zijn.
    # De stap hieronder eist de verplichte artifacts; macOS mag ontbreken.
    if: github.event_name == 'push' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Alleen onze eigen bundels: de buildx-job laat een verborgen
          # `*.dockerbuild`-artifact achter dat de downloader laat stuklopen
          # ("Artifact download failed after 5 retries").
          pattern: flexpoll-*

      - name: Verplichte artifacts controleren
        run: |
          miss=0
          for pat in 'FlexPoll-*linux-x64.tar.gz' 'FlexPoll-*linux-arm64.tar.gz' 'FlexPoll-*windows-x64.zip' 'FlexPoll-*windows-x64-onefile.exe'; do
            if ! ls artifacts/*/$pat >/dev/null 2>&1 && ! ls artifacts/$pat >/dev/null 2>&1; then
              echo "::error::verplicht artifact ontbreekt: $pat"
              miss=1
            fi
          done
          if [ "$miss" = "1" ]; then exit 1; fi
          echo "alle verplichte artifacts aanwezig"
          ls -R artifacts | head -40

      - name: Publiceren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Eén release per tag; bestaande laten staan zodat een her-run aanvult.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "FlexPoll ${GITHUB_REF_NAME#v}" \
                 --notes-file <(sed -n "/## \[${GITHUB_REF_NAME#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -print -exec \
            gh release upload "$GITHUB_REF_NAME" {} --clobber \;

  container:
    name: Container (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          # De Dockerfile staat in docker/; de context blijft de repo-root.
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
